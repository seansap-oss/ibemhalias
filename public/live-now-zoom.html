her':'student',boot=document.getElementById('boot'),title=document.getElementById('title'),msg=document.getElementById('msg'),spin=document.getElementById('spin'),retry=document.getElementById('retry');function fail(t){title.textContent='Live Now is not ready';msg.textContent=t||'Unable to open this webinar.';spin.style.display='none';retry.style.display='inline-block'}retry.onclick=()=>location.reload();async function start(){if(!classId)return fail('The classroom identifier is missing.');if(!window.ZoomMtg)return fail('The webinar client could not be loaded. Check your connection and try again.');try{const r=await fetch('/api/zoom/sdk-session',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({classId,mode})}),s=await r.json();if(!r.ok||!s.ok)throw new Error(s.error||'Unable to authorize Live Now.');const Z=window.ZoomMtg;Z.setZoomJSLib('https://source.zoom.us/6.2.0/lib','/av');Z.preLoadWasm();Z.prepareWebSDK();Z.init({leaveUrl:location.origin+(mode==='teacher'?'/teacher/dashboard':'/live-classes'),patchJsMedia:true,leaveOnPageUnload:true,success:function(){Z.join({sdkKey:s.sdkKey,signature:s.signature,meetingNumber:s.meetingNumber,passWord:s.password||'',userName:s.userName,userEmail:s.userEmail,zak:s.zak||'',success:function(){boot.style.display='none'},error:function(e){fail(e&&(e.reason||e.errorMessage||e.message)||'Unable to join the webinar.')}})},error:function(e){fail(e&&(e.reason||e.errorMessage||e.message)||'Unable to initialize Live Now.')}})}catch(e){fail(e&&e.message?e.message:'Unable to open Live Now.')}}start()})();</script></body></html>
