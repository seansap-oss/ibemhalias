<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Ibemhal IAS Live Now</title>
<style>html,body{width:100%;height:100%;margin:0;background:#07101f;overflow:hidden;font-family:Inter,system-ui,sans-serif}#boot{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:#07101f;color:#fff;padding:24px}#card{width:min(460px,calc(100vw - 48px));border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#0f172a;padding:28px;text-align:center}#brand{display:inline-flex;border-radius:999px;background:rgba(239,68,68,.12);color:#fecaca;padding:8px 12px;font-size:11px;font-weight:900;letter-spacing:.12em}h1{font-size:24px}p{color:#94a3b8;font-size:13px;line-height:1.6}#spin{width:30px;height:30px;margin:22px auto 0;border:3px solid rgba(255,255,255,.12);border-top-color:#818cf8;border-radius:50%;animation:s .8s linear infinite}#retry{display:none;margin:18px auto 0;border:0;border-radius:12px;background:#4f46e5;color:white;padding:11px 18px;font-weight:800}@keyframes s{to{transform:rotate(360deg)}}</style>
<script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js"></script><script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js"></script><script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js"></script><script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js"></script><script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js"></script><script src="https://source.zoom.us/zoom-meeting-6.2.0.min.js"></script></head>
<body><div id="boot"><div id="card"><div id="brand">● LIVE NOW</div><h1 id="title">Preparing your classroom…</h1><p id="msg">Securely connecting the Ibemhal IAS webinar.</p><div id="spin"></div><button id="retry">Try Again</button></div></div>
<script>(function(){const p=new URLSearchParams(location.search),classId=p.get('classId')||'',mode=p.get('mode')==='teacher'?'teacher':'student',boot=document.getElementById('boot'),title=document.getElementById('title'),msg=document.getElementById('msg'),spin=document.getElementById('spin'),retry=document.getElementById('retry');function report(event){if(window.parent)window.parent.postMessage({type:'ibemhal-zoom-session',event:event},location.origin)}function fail(text){title.textContent='Live Now is not ready';msg.textContent=text||'Unable to open this webinar.';spin.style.display='none';retry.style.display='inline-block'}retry.onclick=()=>location.reload();async function start(){if(!classId)return fail('The classroom identifier is missing.');if(!window.ZoomMtg)return fail('The webinar client could not be loaded. Check your connection and try again.');try{const response=await fetch('/api/zoom/sdk-session',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({classId,mode})}),session=await response.json();if(!response.ok||!session.ok)throw new Error(session.error||'Unable to authorize Live Now.');const Zoom=window.ZoomMtg;Zoom.setZoomJSLib('https://source.zoom.us/6.2.0/lib','/av');Zoom.preLoadWasm();Zoom.prepareWebSDK();Zoom.init({leaveUrl:location.origin+(mode==='teacher'?'/teacher/dashboard':'/live-classes'),patchJsMedia:true,leaveOnPageUnload:true,success:function(){Zoom.join({sdkKey:session.sdkKey,signature:session.signature,meetingNumber:session.meetingNumber,passWord:session.password||'',userName:session.userName,userEmail:session.userEmail,zak:session.zak||'',success:function(){boot.style.display='none';report('joined')},error:function(error){fail(error&&(error.reason||error.errorMessage||error.message)||'Unable to join the webinar.')}})},error:function(error){fail(error&&(error.reason||error.errorMessage||error.message)||'Unable to initialize Live Now.')}})}catch(error){fail(error&&error.message?error.message:'Unable to open Live Now.')}}window.addEventListener('beforeunload',()=>report('leaving'));start()})();</script></body></html>
